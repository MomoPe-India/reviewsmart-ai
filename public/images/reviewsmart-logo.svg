<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <!-- Deep Obsidian-Sapphire Luxury Chassis -->
    <linearGradient id="rs-svg-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="35%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- 24K Brushed Champagne Gold Bezel -->
    <linearGradient id="rs-svg-gold-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Facet Light: Top-Left (Pure Radiant Gold) -->
    <linearGradient id="rs-svg-facet-tl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Facet Light: Top-Right (Specular Gold) -->
    <linearGradient id="rs-svg-facet-tr" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Facet Shadow: Bottom-Right (Deep Obsidian Bronze) -->
    <linearGradient id="rs-svg-facet-br" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Facet Tone: Bottom-Left (Warm Core Gold) -->
    <linearGradient id="rs-svg-facet-bl" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Sapphire AI Review Orbit -->
    <linearGradient id="rs-svg-sapphire-orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Typography Smart Gradient -->
    <linearGradient id="rs-svg-smart-text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- 24K AI Badge Gradient -->
    <linearGradient id="rs-svg-ai-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="rs-svg-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ── 1. Luxury Outer Beveled Chassis (x=10, y=10, 60x60) ── -->
  <rect x="10" y="10" width="60" height="60" rx="18" fill="url(#rs-svg-chassis)" stroke="url(#rs-svg-gold-bezel)" stroke-width="1.5" />
  <rect x="12" y="12" width="56" height="56" rx="16" fill="none" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Ambient Glow -->
  <circle cx="40" cy="40" r="24" fill="url(#rs-svg-core-glow)" />

  <!-- Sapphire Review Orbit -->
  <path d="M 27 32 C 32 22, 48 21, 55 28 C 61 34, 59 46, 51 54 C 45 60, 31 60, 25 53" stroke="url(#rs-svg-sapphire-orbit)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="52 14" opacity="0.85" />

  <!-- 3D Precision Faceted Diamond Star (Center: 40, 40. Top: 40, 22. Right: 58, 40. Bottom: 40, 58. Left: 22, 40) -->
  <polygon points="40,40 40,22 22,40" fill="url(#rs-svg-facet-tl)" />
  <polygon points="40,40 40,22 58,40" fill="url(#rs-svg-facet-tr)" />
  <polygon points="40,40 58,40 40,58" fill="url(#rs-svg-facet-br)" />
  <polygon points="40,40 40,58 22,40" fill="url(#rs-svg-facet-bl)" />

  <!-- Central Luminous Diamond Heart -->
  <polygon points="40,33 47,40 40,47 33,40" fill="#ffffff" opacity="0.95" />

  <!-- Micro-Sparkle -->
  <path d="M 58 21 L 59.5 24.5 L 63 26 L 59.5 27.5 L 58 31 L 56.5 27.5 L 53 26 L 56.5 24.5 Z" fill="#fef08a" opacity="0.9" />

  <!-- ── 2. Brand Typography ── -->
  <text x="86" y="49" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#0f172a" letter-spacing="-0.8">Review<tspan fill="url(#rs-svg-smart-text)">Smart</tspan></text>

  <!-- ── 3. Luxury 24K AI Pill Badge ── -->
  <rect x="254" y="27" width="36" height="24" rx="12" fill="url(#rs-svg-ai-badge)" stroke="#f59e0b" stroke-width="1" />
  <text x="272" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#090d16" text-anchor="middle" letter-spacing="0.8">AI</text>
</svg>
